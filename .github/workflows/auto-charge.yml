name: Neptune Auto Charge

on:
  # 定时运行：GitHub 使用 UTC；以下均为北京时间（次日）
  schedule:
    - cron: '47 18 * * *' # 02:47 北京时间
    - cron: '17 19 * * *' # 03:17 北京时间
    - cron: '47 19 * * *' # 03:47 北京时间
    - cron: '17 20 * * *' # 04:17 北京时间
    - cron: '47 20 * * *' # 04:47 北京时间
    - cron: '17 21 * * *' # 05:17 北京时间
    - cron: '47 21 * * *' # 05:47 北京时间
    - cron: '7 22 * * *'  # 06:07 北京时间

  # 支持手动触发（用于测试）
  workflow_dispatch:

jobs:
  auto-charge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest discover -p "test_*.py"

      - name: Create .env file
        run: |
          echo "NEPTUNE_OPEN_ID=${{ secrets.NEPTUNE_OPEN_ID }}" >> .env
          echo "NEPTUNE_AREA_ID=${{ secrets.NEPTUNE_AREA_ID }}" >> .env
          echo "NEPTUNE_EMPLOYEE_ID=${{ secrets.NEPTUNE_EMPLOYEE_ID }}" >> .env

      - name: Run auto charge script
        run: |
          python main.py
